name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Project Setup
        run: |
          npm run setup
          npm run dev:daemon

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          custom_instructions: |
            The project is already set up with all dependencies installed. 
            The server is already running at localhost:3000. Logs from it are being written to logs.txt. If necessary, you can query the db with the 'sqlite3' cli.
            If needed, use the mcp__playwright set of tools to launch a browser and interact with the app. 

          mcp_config: |
            {
              "mcpServers": {
                  "playwright": {
                      "command": "npx",
                      "args": [
                          "@playwright/mcp@latest",
                          "--allowed-origins",
                          "localhost:3000;cdn.tailwindcss.com;esm.sh"
                        ]
                      }
                    }
                  }
          
          allowed_tools: "Bash(npm:*),Bash(sqlite3:*),mcp__playwright__browser_navigate, mcp__playwright__browser_go_back, mcp__playwright__browser_go_forward, mcp__playwright__browser_click, mcp__playwright__browser_double_click, mcp__playwright__browser_hover, mcp__playwright__browser_type, mcp__playwright__browser_press_key, mcp__playwright__browser_select_option, mcp__playwright__browser_snapshot, mcp__playwright__browser_take_screenshot, mcp__playwright__browser_wait_for, mcp__playwright__browser_evaluate, mcp__playwright__browser_console_messages, mcp__playwright__browser_network_requests, mcp__playwright__browser_handle_dialog, mcp__playwright__browser_upload_file, mcp__playwright__browser_drag, mcp__playwright__browser_tab_new, mcp__playwright__browser_tab_list, mcp__playwright__browser_tab_select, mcp__playwright__browser_tab_close, mcp__playwright__browser_close"
